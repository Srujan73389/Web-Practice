<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: black;
        }
        #loader{
            height:50px ;
            width: 50px;
            border: 5px solid rgb(45,44,44);
            border-radius: 50%;
            border-top: 5px solid green;
            animation: loa 1s ease infinite;
        }
        @keyframes loa {
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }

        
    </style>
</head>
<body>
    <div id="loader"></div>
    
</body>
</html>
