<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
        }
        .container{
            box-shadow: 2px 3px 15px #aaa;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            line-height: 40px;
        }
        button{
            background: white;
            padding: 12px 20px;
            border: none;
            box-shadow:  0px 0px 15px grey;
            border-radius: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Colour Generator</h1>
        <p>Current Color:<span id="colourcode">#ffffff</span></p>
        <button id="changebtn">Change Colour</button>
    </main>






    <script src="colour.js"></script>
</body>
</html>
