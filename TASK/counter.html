<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COUNTER APP</title>
    <style>
    body{
        height: 100vh;
        width: 100%;
        justify-content: center;
        align-items: center;
        display: flex;
        font-family: 'Times New Roman', Times, serif;
        background-image: linear-gradient(rgb(114, 114, 144));
        margin: 0;

        }
        #container{
        height: 200px;
        width: 300px;
        border-radius: 20px;
        background-color: aquamarine;
         justify-content: center;
        align-items: center;
        display: flex;
        flex-direction: column;
        box-shadow: 2x 1px 10px blueviolet;


        }
        #container #div_blk button{
            padding: 12px;
            border-radius: 5px;
            background-color: hsl(240, 13%, 33%);
            border: 2px black;
            cursor: pointer;
            color: white;
        }
        #container #div_blk button:hover{
            background-color: hsl(240, 25%, 41%);;
        }
        #container #div_blk button:hover:active{
            background-color:hsl(240, 20%, 17%); ;
        }
    </style>
</head>
<body>
    <section id="container">
        <h1 id="cnt_blk">COUNT : 0</h1>
        <div id="div_blk">
            <button id="incr">+</button>
            <button id="reset">RESET</button>
            <button id="decr">-</button>
        </div>
        
    </section>

    


    <script src="counter.js"></script>
</body>
</html>
