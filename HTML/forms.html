<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend>PERSONAL DETAILS</legend>
            <label for="user">USERNAME</label>
            <input type="text" name="user" id="user" placeholder="Enter Username"><br><br>

            <label for="pass">PASSWORD</label>
            <input type="password" name="pass" id="pass" placeholder="Enter Password" minlength="7" required><br><br>

               <label for="emailid">MAIL ID : </label>
        <input type="email" name="emailid" id="emailid" mailto:placeholder="exmaple@gmail.com"><br><br>

           <label for="pno">PH.NO: </label>
        <input type="tel" name="pno" id="pno" minlength="10" maxlength="10"><br><br>

           <label for="dob">DOB : </label>
        <input type="date" name="dob" id="dob" disabled ><br><br>

        <label for="re">RESUME</label>
        <input type="file" id="re" name="re" multiple><br><br>

           <label for="age">AGE : </label>
        <input type="number" name="age" id="age" min="21" max="60"><br><br>

        <label for="gen">GENDER:</label>
        <input type="radio" name="gen" id="gen" value="MALE">MALE
        <input type="radio" name="gen" id="gen" value="FEMALE">FEMALE<br><br>

        <label for="lang">LANGUAGES:</label>
        <input type="checkbox" name="lang" id="lang" value="ENGLISH">ENGLISH
        <input type="checkbox" name="lang" id="lang" value="KANNADA">KANNADA
        <input type="checkbox" name="lang" id="lang" value="HINDI">HINDI
        <input type="checkbox" name="lang" id="lang" value="MALAYALAM">MALAYALAM
        <input type="checkbox" name="lang" id="lang" value="MARATI">MARATI
        <input type="checkbox" name="lang" id="lang" value="RAJASTHANI">RAJASTHANI
        <input type="checkbox" name="lang" id="lang" value="PUNJABI">PUNJABI<br><br>
        
        <label for="qua">QUALIFICATION</label>
        <select name="qua" id="qua">
            <option value="CSE">CSE</option>
            <option value="BSE">BSE</option>
            <option value="BE">BE</option>
            <option value="EEE">EEE</option>
            <option value="ECE">ECE</option>
        </select><br><br>








        <button>SUBMIT</button>





        </fieldset>
        <fieldset>
            
        </fieldset>


    </form>
    
    
</body>
</html>
